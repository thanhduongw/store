services:
  - type: web
    name: store
    runtime: docker
    branch: feature/fix-ecommerce
    plan: free
    healthCheckPath: /up
    disk:
      name: sqlite-storage
      mountPath: /rails/storage
      sizeGB: 1
    envVars:
      - key: RAILS_MASTER_KEY
        sync: false
      - key: RAILS_SERVE_STATIC_FILES
        value: "true"
      - key: RAILS_LOG_TO_STDOUT
        value: "true"
